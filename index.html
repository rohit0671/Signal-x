<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Video Player</title>
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<script src="https://sad.adsgram.ai/js/sad.min.js" defer></script>
<style>
  :root {
    --bg:        #0e0e0e;
    --surface:   #1a1a1a;
    --surface-2: #222222;
    --border:    #2a2a2a;
    --accent:    #6c63ff;
    --accent-soft: rgba(108,99,255,0.12);
    --text:      #f0f0f0;
    --muted:     #888888;
    --danger:    #ef4444;
    --r-lg: 16px;
    --r-md: 12px;
    --r-sm: 8px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100%;
    overflow-x: hidden;
  }

  button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; }

  /* ── Loading ── */
  #loading {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; gap: 16px; color: var(--muted);
  }
  .spinner {
    width: 38px; height: 38px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Error ── */
  #error {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; gap: 10px; padding: 24px; text-align: center;
  }
  #error .err-icon { font-size: 38px; }
  #error strong { color: var(--text); font-size: 16px; }
  #error p { color: var(--muted); font-size: 14px; max-width: 280px; }
  .retry-btn {
    margin-top: 12px;
    padding: 10px 28px;
    border-radius: var(--r-sm);
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    transition: opacity 0.2s;
  }
  .retry-btn:active { opacity: 0.7; }

  /* ══════════ PREVIEW CARD (Compact, Standard UI) ══════════ */
  #preview-overlay {
    display: none;
    position: fixed; inset: 0;
    align-items: center; justify-content: center;
    padding: 20px;
    z-index: 500;
    background: var(--bg);
  }

  .preview-card {
    position: relative;
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 12px; /* Compact spacing like Reference 1 */
  }

  /* 1. Thumbnail */
  .preview-thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    overflow: hidden;
  }
  .preview-thumb-img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .preview-thumb-img[hidden] { display: none; }
  .preview-thumb-fallback {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
    color: var(--border);
  }
  .preview-play-ring {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .preview-play-ring span {
    width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: #fff;
    color: #000;
    font-size: 20px;
    padding-left: 3px;
  }
  .preview-dur-chip {
    position: absolute; right: 10px; bottom: 10px;
    background: rgba(0,0,0,0.8);
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
  }

  /* 2. Video Details (Tight below thumbnail) */
  .preview-title {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--text);
    word-break: break-word;
    padding: 0 4px;
  }

  .preview-badges {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 0 4px;
  }
  .badge {
    display: flex; align-items: center; gap: 4px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
  }
  .badge.hd {
    background: var(--accent-soft);
    border-color: transparent;
    color: var(--accent);
    font-weight: 600;
  }

  /* 3. Watch Button (Solid Purple, Standard UI) */
  .watch-btn {
    width: 100%;
    padding: 14px;
    border-radius: var(--r-md);
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .15s ease, opacity .15s ease;
  }
  .watch-btn:active { transform: scale(0.98); }
  .watch-btn:disabled { opacity: .7; }

  .mini-spinner {
    width: 15px; height: 15px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }

  /* ══════════ FULLSCREEN CUSTOM PLAYER (Standard UI, No Emojis) ══════════ */
  #player-wrap {
    display: none;
    position: fixed; inset: 0;
    background: #000;
    z-index: 900;
  }
  .player-root {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #vid {
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;
  }

  .tap-layer { position: absolute; inset: 0; z-index: 1; }

  .buffering-spinner {
    position: absolute; z-index: 2;
    width: 42px; height: 42px;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    display: none;
    pointer-events: none;
  }

  .controls-top, .controls-bottom, .center-controls {
    position: absolute; z-index: 3;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
  }
  .player-root.show-controls .controls-top,
  .player-root.show-controls .controls-bottom,
  .player-root.show-controls .center-controls {
    opacity: 1;
    pointer-events: auto;
  }

  /* Top Header */
  .controls-top {
    top: 0; left: 0; right: 0;
    padding: calc(14px + var(--safe-t)) 14px 40px;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(180deg, rgba(0,0,0,0.65), transparent);
  }
  .back-btn {
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
    font-size: 20px;
    flex-shrink: 0;
  }
  .player-title-mini {
    font-size: 14px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Center Controls (Standard Bold UI) */
  .center-controls {
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: 28px;
  }
  .ctrl-round {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 46px; height: 46px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    font-size: 20px;
    line-height: 1;
  }
  .ctrl-round .ctrl-sub { font-size: 9px; margin-top: 2px; font-weight: 700; }
  .ctrl-round.big {
    width: 64px; height: 64px;
    font-size: 26px;
    background: rgba(255,255,255,0.18);
  }

  /* Bottom Controls (Standard UI, no emojis) */
  .controls-bottom {
    left: 0; right: 0; bottom: 0;
    padding: 30px 16px calc(14px + var(--safe-b));
    background: linear-gradient(0deg, rgba(0,0,0,0.75), transparent);
  }

  .seek-wrap { position: relative; height: 20px; display: flex; align-items: center; margin-bottom: 4px; }
  .seek-track {
    position: absolute; left: 0; right: 0;
    height: 4px; border-radius: 3px;
    background: rgba(255,255,255,0.22);
    overflow: visible;
  }
  .seek-buffered, .seek-progress {
    position: absolute; top: 0; left: 0; height: 100%;
    border-radius: 3px;
  }
  .seek-buffered { background: rgba(255,255,255,0.35); width: 0%; }
  .seek-progress { background: var(--accent); width: 0%; }
  .seek-thumb {
    position: absolute; top: 50%; left: 0%;
    width: 13px; height: 13px;
    background: #fff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 4px rgba(255,255,255,0.15);
  }
  .seek-input {
    position: relative; z-index: 2;
    width: 100%; height: 20px;
    -webkit-appearance: none; appearance: none;
    background: transparent;
    margin: 0;
  }
  .seek-input::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    background: transparent;
  }
  .seek-input::-moz-range-thumb {
    width: 20px; height: 20px;
    background: transparent; border: none;
  }

  .bottom-row {
    display: flex; align-items: center; gap: 10px;
    margin-top: 6px;
  }
  .time-txt { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .time-txt.muted { color: rgba(255,255,255,0.5); }
  .time-sep { color: rgba(255,255,255,0.4); font-size: 12px; }
  .spacer { flex: 1; }
  .icon-btn {
    display: flex; align-items: center; justify-content: center;
    min-width: 30px; height: 30px;
    padding: 0 6px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    position: relative;
  }
  .icon-btn:active { background: rgba(255,255,255,0.12); }

  .speed-menu {
    position: absolute;
    right: 16px; bottom: calc(72px + var(--safe-b));
    z-index: 4;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .speed-menu button {
    display: block;
    width: 84px;
    padding: 10px 14px;
    font-size: 13px;
    text-align: left;
    color: var(--muted);
    font-weight: 500;
  }
  .speed-menu button.active { color: var(--accent); font-weight: 700; }
  .speed-menu button:active { background: rgba(255,255,255,0.06); }

  /* Player Error Overlay */
  #player-error-overlay {
    display: none;
    position: absolute; inset: 0;
    z-index: 10;
    background: rgba(0,0,0,0.75);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 24px;
    text-align: center;
  }
  #player-error-overlay .err-icon { font-size: 38px; }
  #player-error-overlay strong { font-size: 16px; }
  #player-error-overlay p { color: var(--muted); font-size: 14px; max-width: 280px; }

  /* Keyboard Shortcuts Hint */
  .kb-hint {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 3;
  }
  .kb-hint.show { opacity: 1; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Loading video...</p>
</div>

<div id="error">
  <div class="err-icon">⚠</div>
  <strong id="err-title">Something went wrong</strong>
  <p id="err-msg">Could not load the video.</p>
  <button class="retry-btn" id="retry-btn">Try Again</button>
</div>

<!-- Preview Card (Compact, No Emojis, Standard UI) -->
<div id="preview-overlay">
  <div class="preview-card">
    
    <!-- 1. Thumbnail -->
    <div class="preview-thumb-wrap">
      <img class="preview-thumb-img" id="thumb-img" alt="Video thumbnail" hidden />
      <div class="preview-thumb-fallback" id="thumb-fallback">🎬</div>
      <div class="preview-play-ring"><span>▶</span></div>
      <div class="preview-dur-chip" id="preview-dur-chip" hidden></div>
    </div>

    <!-- 2. Video Details (Directly below) -->
    <div class="preview-title" id="preview-title">—</div>
    
    <div class="preview-badges">
      <div class="badge" id="p-size">12.42 MB</div>
      <div class="badge" id="p-dur">01:03</div>
      <div class="badge hd">HD</div>
    </div>

    <!-- 3. Watch Button (Solid Purple, Standard UI) -->
    <button class="watch-btn" id="watch-btn">
      <span id="watch-btn-label">Watch Now</span>
    </button>

  </div>
</div>

<!-- Fullscreen Custom Player (Standard UI, No Emojis) -->
<div id="player-wrap">
  <div class="player-root" id="player-root">
    <video id="vid" playsinline preload="metadata" aria-label="Video player"></video>

    <div class="buffering-spinner" id="buffering-spinner" role="status" aria-label="Buffering"></div>
    <div class="tap-layer" id="tap-layer" role="button" aria-label="Toggle controls"></div>

    <div class="kb-hint" id="kb-hint">Space: play/pause · ← →: seek</div>

    <div class="controls-top" id="controls-top">
      <button class="back-btn" id="back-btn" aria-label="Close player">←</button>
      <div class="player-title-mini" id="player-title-mini">—</div>
    </div>

    <div class="center-controls" id="center-controls">
      <button class="ctrl-round" id="skip-back-btn" aria-label="Rewind 10 seconds">
        <span>↺</span><span class="ctrl-sub">10</span>
      </button>
      <button class="ctrl-round big" id="center-play-btn" aria-label="Play">▶</button>
      <button class="ctrl-round" id="skip-fwd-btn" aria-label="Forward 10 seconds">
        <span>↻</span><span class="ctrl-sub">10</span>
      </button>
    </div>

    <div class="controls-bottom" id="controls-bottom">
      <div class="seek-wrap">
        <div class="seek-track" id="seek-track">
          <div class="seek-buffered" id="seek-buffered"></div>
          <div class="seek-progress" id="seek-progress"></div>
          <div class="seek-thumb" id="seek-thumb"></div>
        </div>
        <input type="range" id="seek-input" class="seek-input" min="0" max="1000" step="1" value="0" aria-label="Seek bar" />
      </div>
      <div class="bottom-row">
        <span class="time-txt" id="time-current">0:00</span>
        <span class="time-sep">/</span>
        <span class="time-txt muted" id="time-duration">0:00</span>
        <div class="spacer"></div>
        <button class="icon-btn" id="speed-btn" aria-label="Playback speed">1x</button>
        <button class="icon-btn" id="mute-btn" aria-label="Mute">🔊</button>
        <button class="icon-btn" id="fullscreen-btn" aria-label="Fullscreen">⛶</button>
        <button class="icon-btn" id="pip-btn" aria-label="Picture-in-Picture">⛶</button>
      </div>
    </div>

    <div class="speed-menu" id="speed-menu" hidden>
      <button data-speed="0.5">0.5x</button>
      <button data-speed="0.75">0.75x</button>
      <button data-speed="1" class="active">1x</button>
      <button data-speed="1.25">1.25x</button>
      <button data-speed="1.5">1.5x</button>
      <button data-speed="2">2x</button>
    </div>

    <!-- Player error overlay -->
    <div id="player-error-overlay">
      <div class="err-icon">⚠</div>
      <strong>Playback Error</strong>
      <p id="player-err-msg">Could not load this video. Check your connection and try again.</p>
      <button class="retry-btn" id="player-retry-btn">Retry</button>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  /* ── Config ── */
  const STREAM_SERVER_URL = "https://tgfilestor-a18.a.jrnm.app/";
  const ADSGRAM_BLOCK_ID_1 = "int-37243";
  const ADSGRAM_BLOCK_ID_2 = "int-41737";

  const params        = new URLSearchParams(window.location.search);
  const STREAM_SERVER  = (params.get("stream") || STREAM_SERVER_URL).replace(/\/+$/, "");

  const tg = window.Telegram?.WebApp;
  if (tg) { tg.expand(); tg.ready(); }

  function getStartParam() {
    const fromUrl = params.get("msg");
    if (fromUrl) return fromUrl;
    const fromUnsafe = tg?.initDataUnsafe?.start_param;
    if (fromUnsafe) return fromUnsafe;
    try {
      const initData = tg?.initData || "";
      const parsed = new URLSearchParams(initData);
      const sp = parsed.get("start_param");
      if (sp) return sp;
    } catch (e) {}
    try {
      const hash = window.location.hash.replace("#", "");
      const hashParams = new URLSearchParams(hash);
      const sp = hashParams.get("tgWebAppStartParam") || hashParams.get("start_param");
      if (sp) return sp;
    } catch (e) {}
    return null;
  }

  const msgId = getStartParam();

  let AdController1 = null;
  let AdController2 = null;
  try {
    AdController1 = window.Adsgram?.init({ blockId: ADSGRAM_BLOCK_ID_1 }) || null;
  } catch (e) { console.warn("Adsgram init failed (block 1)", e); }
  try {
    AdController2 = window.Adsgram?.init({ blockId: ADSGRAM_BLOCK_ID_2 }) || null;
  } catch (e) { console.warn("Adsgram init failed (block 2)", e); }

  function fmtSize(b) {
    if (b == null || isNaN(b)) return "—";
    const u = ["B","KB","MB","GB","TB"];
    let i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return `${b.toFixed(1)} ${u[i]}`;
  }
  function fmtDur(s) {
    if (s == null || isNaN(s) || s < 0) return null;
    s = Math.floor(s);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return h ? `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}` : `${m}:${String(sec).padStart(2,"0")}`;
  }

  function showError(title, msg) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("preview-overlay").style.display = "none";
    document.getElementById("player-wrap").style.display = "none";
    const el = document.getElementById("error");
    el.style.display = "flex";
    document.getElementById("err-title").textContent = title;
    document.getElementById("err-msg").textContent   = msg;
  }

  const els = {
    thumbImg: document.getElementById("thumb-img"),
    thumbFallback: document.getElementById("thumb-fallback"),
    durChip: document.getElementById("preview-dur-chip"),
    title: document.getElementById("preview-title"),
    size: document.getElementById("p-size"),
    dur: document.getElementById("p-dur"),
    watchBtn: document.getElementById("watch-btn"),
    watchBtnLabel: document.getElementById("watch-btn-label"),
    previewOverlay: document.getElementById("preview-overlay"),
    playerWrap: document.getElementById("player-wrap"),
    playerRoot: document.getElementById("player-root"),
    vid: document.getElementById("vid"),
    tapLayer: document.getElementById("tap-layer"),
    backBtn: document.getElementById("back-btn"),
    playerTitleMini: document.getElementById("player-title-mini"),
    centerPlayBtn: document.getElementById("center-play-btn"),
    skipBackBtn: document.getElementById("skip-back-btn"),
    skipFwdBtn: document.getElementById("skip-fwd-btn"),
    seekInput: document.getElementById("seek-input"),
    seekBuffered: document.getElementById("seek-buffered"),
    seekProgress: document.getElementById("seek-progress"),
    seekThumb: document.getElementById("seek-thumb"),
    timeCurrent: document.getElementById("time-current"),
    timeDuration: document.getElementById("time-duration"),
    speedBtn: document.getElementById("speed-btn"),
    speedMenu: document.getElementById("speed-menu"),
    muteBtn: document.getElementById("mute-btn"),
    fullscreenBtn: document.getElementById("fullscreen-btn"),
    pipBtn: document.getElementById("pip-btn"),
    bufferingSpinner: document.getElementById("buffering-spinner"),
    playerErrorOverlay: document.getElementById("player-error-overlay"),
    playerErrMsg: document.getElementById("player-err-msg"),
    playerRetryBtn: document.getElementById("player-retry-btn"),
    retryBtn: document.getElementById("retry-btn"),
    kbHint: document.getElementById("kb-hint"),
  };

  let videoInfo = null;
  let isScrubbing = false;
  let kbHintTimeout = null;

  if (!msgId) {
    showError("No Video Selected", "Open a shared video link from the bot to start watching.");
  } else {
    loadInfo(msgId);
  }

  async function loadInfo(id) {
    try {
      const controller = new AbortController();
      const timeoutId  = setTimeout(() => controller.abort(), 15000);
      const res = await fetch(`${STREAM_SERVER}/info?msg=${id}`, { signal: controller.signal });
      clearTimeout(timeoutId);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      videoInfo = await res.json();
    } catch (e) {
      console.error("Failed to load video info", e);
      const msg = e.name === "AbortError" ? "The server took too long to respond." : "Video deleted or link invalid.";
      showError("Video Not Found", msg);
      return;
    }
    populatePreview(videoInfo);
    document.getElementById("loading").style.display = "none";
    els.previewOverlay.style.display = "flex";
  }

  function populatePreview(info) {
    els.title.textContent = info.title || "Video";
    els.playerTitleMini.textContent = info.title || "Video";
    els.size.textContent = fmtSize(info.size);
    
    const dur = fmtDur(info.duration);
    if (dur) {
      els.dur.textContent = dur;
      els.durChip.textContent = dur;
      els.durChip.hidden = false;
    }

    const thumbUrl = `${STREAM_SERVER}/thumb?msg=${msgId}`;
    els.thumbImg.onload  = () => { els.thumbImg.hidden = false; els.thumbFallback.style.display = "none"; };
    els.thumbImg.onerror = () => { els.thumbImg.hidden = true;  els.thumbFallback.style.display = "flex"; };
    els.thumbImg.src = thumbUrl;
  }

  function runAd(controller, label) {
    return new Promise((resolve) => {
      if (!controller) { resolve(); return; }
      let settled = false;
      const finish = () => {
        if (settled) return;
        settled = true;
        clearTimeout(safetyTimer);
        resolve();
      };
      const safetyTimer = setTimeout(() => {
        console.warn(`Adsgram (${label}): no response in time, skipping`);
        finish();
      }, 8000);
      controller.show().then(finish).catch((result) => {
        console.warn(`Adsgram (${label}): ad not completed`, result);
        finish();
      });
    });
  }

  els.watchBtn.addEventListener("click", () => {
    els.watchBtn.disabled = true;
    els.watchBtnLabel.textContent = "Loading...";
    runAd(AdController1, "block " + ADSGRAM_BLOCK_ID_1)
      .then(() => runAd(AdController2, "block " + ADSGRAM_BLOCK_ID_2))
      .then(() => {
        els.previewOverlay.style.display = "none";
        openPlayer();
      });
  });

  els.retryBtn.addEventListener("click", () => {
    document.getElementById("error").style.display = "none";
    document.getElementById("loading").style.display = "flex";
    loadInfo(msgId);
  });

  function openPlayer() {
    els.vid.src = `${STREAM_SERVER}/stream?msg=${msgId}`;
    els.playerWrap.style.display = "block";
    showControls(true);
    showKbHint();
    const playPromise = els.vid.play();
    if (playPromise && playPromise.catch) {
      playPromise.catch(() => {});
    }
  }

  function showKbHint() {
    els.kbHint.classList.add("show");
    clearTimeout(kbHintTimeout);
    kbHintTimeout = setTimeout(() => els.kbHint.classList.remove("show"), 4000);
  }

  els.backBtn.addEventListener("click", () => {
    els.vid.pause();
    els.playerWrap.style.display = "none";
    els.previewOverlay.style.display = "flex";
    els.watchBtn.disabled = false;
    els.watchBtnLabel.textContent = "Watch Now";
    els.playerErrorOverlay.style.display = "none";
    els.vid.src = "";
  });

  let hideTimer = null;
  function showControls(persist) {
    els.playerRoot.classList.add("show-controls");
    clearTimeout(hideTimer);
    if (!persist && !els.vid.paused) {
      hideTimer = setTimeout(() => els.playerRoot.classList.remove("show-controls"), 3000);
    }
  }
  els.tapLayer.addEventListener("click", () => {
    if (els.playerRoot.classList.contains("show-controls")) {
      els.playerRoot.classList.remove("show-controls");
      clearTimeout(hideTimer);
    } else {
      showControls(false);
    }
    els.speedMenu.hidden = true;
  });

  function togglePlay() {
    if (els.vid.paused) els.vid.play(); else els.vid.pause();
  }
  els.centerPlayBtn.addEventListener("click", (e) => { e.stopPropagation(); togglePlay(); });
  els.vid.addEventListener("play",  () => { els.centerPlayBtn.textContent = "⏸"; showControls(false); });
  els.vid.addEventListener("pause", () => { els.centerPlayBtn.textContent = "▶"; showControls(true); });
  els.vid.addEventListener("ended", () => { els.centerPlayBtn.textContent = "↻"; showControls(true); });

  els.vid.addEventListener("waiting", () => { els.bufferingSpinner.style.display = "block"; });
  els.vid.addEventListener("playing", () => { els.bufferingSpinner.style.display = "none"; });
  els.vid.addEventListener("canplay", () => { els.bufferingSpinner.style.display = "none"; });

  els.skipBackBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    els.vid.currentTime = Math.max(0, els.vid.currentTime - 10);
    showControls(false);
    showKbHint();
  });
  els.skipFwdBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    els.vid.currentTime = Math.min(els.vid.duration || Infinity, els.vid.currentTime + 10);
    showControls(false);
    showKbHint();
  });

  els.vid.addEventListener("loadedmetadata", () => {
    els.timeDuration.textContent = fmtDur(els.vid.duration) || "0:00";
    updateSeekUI();
  });
  els.vid.addEventListener("timeupdate", () => {
    if (isScrubbing) return;
    updateSeekUI();
  });
  els.vid.addEventListener("progress", () => { updateBufferedProgress(); });

  function updateBufferedProgress() {
    if (!els.vid.buffered.length || !els.vid.duration) return;
    let maxEnd = 0;
    for (let i = 0; i < els.vid.buffered.length; i++) {
      const end = els.vid.buffered.end(i);
      if (end > maxEnd) maxEnd = end;
    }
    const pct = Math.min((maxEnd / els.vid.duration) * 100, 100);
    els.seekBuffered.style.width = pct + "%";
  }

  function updateSeekUI() {
    const dur = els.vid.duration || 0;
    const cur = els.vid.currentTime || 0;
    const pct = dur ? (cur / dur) * 100 : 0;
    els.seekProgress.style.width = pct + "%";
    els.seekThumb.style.left = pct + "%";
    els.seekInput.value = dur ? Math.round((cur / dur) * 1000) : 0;
    els.timeCurrent.textContent = fmtDur(cur) || "0:00";
    updateBufferedProgress();
  }

  els.seekInput.addEventListener("input", () => {
    isScrubbing = true;
    const dur = els.vid.duration || 0;
    const pct = els.seekInput.value / 1000;
    els.seekProgress.style.width = (pct * 100) + "%";
    els.seekThumb.style.left = (pct * 100) + "%";
    const cur = pct * dur;
    els.timeCurrent.textContent = fmtDur(cur) || "0:00";
    showControls(true);
  });
  els.seekInput.addEventListener("change", () => {
    const dur = els.vid.duration || 0;
    els.vid.currentTime = (els.seekInput.value / 1000) * dur;
    isScrubbing = false;
    showControls(false);
  });

  els.speedBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    els.speedMenu.hidden = !els.speedMenu.hidden;
    showControls(true);
  });
  els.speedMenu.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const rate = parseFloat(btn.dataset.speed);
      els.vid.playbackRate = rate;
      els.speedBtn.textContent = rate + "x";
      els.speedMenu.querySelectorAll("button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      els.speedMenu.hidden = true;
      showControls(false);
    });
  });

  els.muteBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    els.vid.muted = !els.vid.muted;
    els.muteBtn.textContent = els.vid.muted ? "🔊" : "🔊";
    showControls(false);
  });

  els.fullscreenBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (fsEl) {
      (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
    } else if (els.playerRoot.requestFullscreen) {
      els.playerRoot.requestFullscreen().catch((err) => { console.warn("Fullscreen failed:", err); });
    } else if (els.playerRoot.webkitRequestFullscreen) {
      els.playerRoot.webkitRequestFullscreen();
    } else if (els.vid.webkitEnterFullscreen) {
      els.vid.webkitEnterFullscreen();
    }
    showControls(false);
  });

  els.pipBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (document.pictureInPictureElement) {
      document.exitPictureInPicture().catch(() => {});
    } else if (els.vid.requestPictureInPicture) {
      els.vid.requestPictureInPicture().catch((err) => { console.warn("PiP failed:", err); });
    }
    showControls(false);
  });

  document.addEventListener("keydown", (e) => {
    if (els.playerWrap.style.display !== "block") return;
    const key = e.key;
    if (key === " " || key === "Space") {
      e.preventDefault();
      togglePlay();
      showKbHint();
    } else if (key === "ArrowRight") {
      e.preventDefault();
      els.vid.currentTime = Math.min(els.vid.duration || Infinity, els.vid.currentTime + 10);
      showKbHint();
    } else if (key === "ArrowLeft") {
      e.preventDefault();
      els.vid.currentTime = Math.max(0, els.vid.currentTime - 10);
      showKbHint();
    } else if (key === "f" || key === "F") {
      e.preventDefault();
      els.fullscreenBtn.click();
    } else if (key === "m" || key === "M") {
      e.preventDefault();
      els.muteBtn.click();
    }
  });

  els.vid.addEventListener("error", () => {
    els.bufferingSpinner.style.display = "none";
    console.error("Video error", els.vid.error);
    els.playerErrorOverlay.style.display = "flex";
    let msg = "Could not load this video. Check your connection and try again.";
    if (els.vid.error) {
      switch (els.vid.error.code) {
        case 1: msg = "Video loading aborted."; break;
        case 2: msg = "Network error – check your connection."; break;
        case 3: msg = "Video decoding failed. Try again later."; break;
        case 4: msg = "Video format not supported."; break;
      }
    }
    els.playerErrMsg.textContent = msg;
  });

  els.playerRetryBtn.addEventListener("click", () => {
    els.playerErrorOverlay.style.display = "none";
    els.vid.load();
    els.vid.play().catch(() => {});
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && els.vid && !els.vid.paused) {
      els.vid.pause();
    }
  });

  window.addEventListener("popstate", () => {
    if (els.playerWrap.style.display === "block") {
      els.backBtn.click();
    }
  });

}); // end DOMContentLoaded
</script>
</body>
</html>
